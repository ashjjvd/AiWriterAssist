name: Format Rust Source

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust files
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Commit formatted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "Apply automatic Rust formatting"
            git push origin HEAD:main
          fi

      - name: Trigger validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main