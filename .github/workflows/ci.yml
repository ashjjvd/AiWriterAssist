name: validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and build genuine lexical database
        shell: bash
        env:
          PINNED_OEWN_SHA256: ${{ vars.OEWN_SHA256 }}
          PINNED_MOBY_SHA256: ${{ vars.MOBY_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lexical"

          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/lexical/oewn.xml.gz" \
            'https://en-word.net/static/english-wordnet-2025.xml.gz'

          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/lexical/moby.txt" \
            'https://www.gutenberg.org/cache/epub/3202/pg3202.txt'

          gzip -t "$RUNNER_TEMP/lexical/oewn.xml.gz"
          grep -qi 'Moby Thesaurus' "$RUNNER_TEMP/lexical/moby.txt"

          OEWN_SHA256="$(sha256sum "$RUNNER_TEMP/lexical/oewn.xml.gz" | cut -d' ' -f1)"
          MOBY_SHA256="$(sha256sum "$RUNNER_TEMP/lexical/moby.txt" | cut -d' ' -f1)"

          echo "OEWN_SHA256=$OEWN_SHA256"
          echo "MOBY_SHA256=$MOBY_SHA256"

          if [[ -n "$PINNED_OEWN_SHA256" && "$PINNED_OEWN_SHA256" != "$OEWN_SHA256" ]]; then
            echo '::error::Open English WordNet checksum mismatch.'
            exit 1
          fi

          if [[ -n "$PINNED_MOBY_SHA256" && "$PINNED_MOBY_SHA256" != "$MOBY_SHA256" ]]; then
            echo '::error::Moby checksum mismatch.'
            exit 1
          fi

          if [[ -z "$PINNED_OEWN_SHA256" || -z "$PINNED_MOBY_SHA256" ]]; then
            echo '::warning::Source hashes not independently pinned. Review SHA256 and configure repository variables before release.'
          fi

          python3 scripts/dictionaries/build.py \
            --wordnet "$RUNNER_TEMP/lexical/oewn.xml.gz" \
            --moby "$RUNNER_TEMP/lexical/moby.txt" \
            --wordnet-sha256 "$OEWN_SHA256" \
            --moby-sha256 "$MOBY_SHA256"

          python3 scripts/dictionaries/verify.py

      - uses: actions/upload-artifact@v4
        with:
          name: lexical-database
          path: |
            src-tauri/resources/dictionaries/lexical.sqlite
            src-tauri/resources/dictionaries/lexical.manifest.json
          if-no-files-found: error
          retention-days: 7

  checks:
    needs: dictionaries
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lexical-database
          path: src-tauri/resources/dictionaries

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
        working-directory: src-tauri

      - name: Verify real lexical DB (release gate)
        run: python3 scripts/dictionaries/verify.py

      - name: Build native app
        run: pnpm tauri build